# La vitrine : ce depot horodate SES PROPRES releases avec sa propre action.
# L'outil qui se prouve lui-meme — et notre banc d'essai permanent.
name: timestamp-release
on:
  release:
    types: [published, edited]
  workflow_dispatch:

# Une seule execution a la fois : les evenements 'edited' en rafale (nos
# propres attachements de certificats) se serialisent au lieu de se battre.
concurrency:
  group: hashlock-timestamp-${{ github.ref }}

permissions:
  contents: write   # necessaire pour attacher les certificats a la release

jobs:
  timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          wallet-mnemonic: ${{ secrets.HASHLOCK_WALLET }}
          network: mainnet
