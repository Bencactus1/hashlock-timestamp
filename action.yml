name: "Hashlock Timestamp"
description: "Proof of existence for every release (requires the workflow to grant `permissions: id-token: write` and `contents: write`): anchors the SHA-256 of your release assets and commit on the Algorand blockchain via x402 (0.005 USDC per proof). Certificates are attached to the release."
author: "PronodeAlgo"
branding:
  icon: "lock"
  color: "blue"

inputs:
  wallet-mnemonic:
    description: "25-word mnemonic of a DEDICATED Algorand wallet holding a little USDC (1 USDC = 200 proofs). Never use your main wallet. Store it as a repository secret."
    required: true
  network:
    description: "algorand network: 'testnet' (free trial, testnet USDC) or 'mainnet'"
    required: false
    default: "testnet"
  restamp-on-edit:
    description: "what to do when a PUBLISHED release is edited: 'true' (default) re-proves the new state with a dated proof; 'false' = strict mode, the edit is NOT re-proven and the badge stays red until you re-run the workflow yourself"
    required: false
    default: "true"
  attach-certificates:
    description: "attach the PDF certificates to the release ('true'/'false')"
    required: false
    default: "true"
  github-token:
    description: "token used to read assets and attach certificates"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    # No download at runtime: the payment libraries are bundled, frozen, into
    # dist/index.mjs (built once with @vercel/ncc, reviewed, committed). This
    # closes the supply-chain window - nothing is fetched from npm when the
    # action runs. To update the libraries: rebuild the bundle and commit it.
    - name: Timestamp the release
      shell: bash
      env:
        HASHLOCK_WALLET_MNEMONIC: ${{ inputs.wallet-mnemonic }}
        HASHLOCK_NETWORK: ${{ inputs.network }}
        HASHLOCK_ATTACH: ${{ inputs.attach-certificates }}
        HASHLOCK_RESTAMP: ${{ inputs.restamp-on-edit }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "${{ github.action_path }}/dist/index.mjs"
